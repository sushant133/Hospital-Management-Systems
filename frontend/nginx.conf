server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API is proxied under the same origin so the httpOnly SameSite=Strict
  # auth cookies keep working exactly as they do behind the Vite dev proxy.
  location /api/ {
    proxy_pass         http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Client-side routing: unknown paths are React routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
